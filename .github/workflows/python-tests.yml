name: Python Testing Pipeline

on: [push, pull_request]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    # 1. Download your code onto the cloud runner
    - name: Check out repository code
      uses: actions/checkout@v4

    # 2. Set up uv and Python
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: '3.13
        enable-cache: true
        cache-dependency-glob: "" 

    # 3. Explicitly install pytest
    - name: Install dependencies
      run: uv pip install pytest

    # 4. Debug step: List files so you can verify test_calculator.py exists
    - name: List files in repository
      run: ls -la

    # 5. Execute the automated test file directly
    - name: Run pytest
      run: uv run pytest